<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spele</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px 16px; margin: 6px 0; cursor: pointer; }
img, audio { max-width: 100%; }
[hidden] { display: none !important; }

/* NOFORMĒ ŠEIT: pielieto 2.1. un 2.2. nodarbībā apgūto CSS */
body {
  background-color: #f10404;
  color: #222222;
}

h1 {
  color: #222222;
  font-size: 36px;
  text-align: center;
}

.noteikumi {
  background-color: #f71e17;
  color: #222222;
  padding: 16px;
  border-radius: 12px;
}

.laukums {
  width: 360px;
  padding: 20px;
  border: 2px dashed #b89494;
  border-radius: 12px;
  margin: 20px auto;
  max-width: 100%;
  text-align: center;
  background-color: #e9a2a2;
  box-sizing: border-box;
}

button {
  background-color: #ff1414;
  color: #ffffff;
  border: 2px;
  border-radius: 12px;
}
button:hover {
  background-color: #ff0000;
}
</style>
</head>
<body>
<h1>Spēle</h1>
<p>Spēles mērķis ir uzvarēt.</p>
<section class="noteikumi">
  <h2>Noteikumi</h2>
  <p>Punktus iegūst spiežot uz pogas izvairies no šķēršļiem</p>
    <p>Skaņu dzirdēt var uzpiežot pogu</p>
</section>
<div class="laukums">
  <h2>Spēles laukums</h2>
  <img src="atteli/varonis.png" alt="Spēles varonis" width="128">
  <p>Skaņas efekti:</p>
  <audio controls src="skanas/klikskis.wav"></audio>
  <p id="punkti">Punkti: 0</p>
  <button onclick="savakt()">Izvarites no šķēršļiem</button>
</div>
<script>
// Gatava punktu poga — šo skriptu nemaini.
let punkti = 0;
function savakt() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}
</script>
</body>
</html>
